[project]
name = "peeksy"
version = "0.1.0"
description = "Playwright-based visual regression CLI: generate baselines, test against them, build Allure reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "pixelmatch==0.4.0",
    "pillow>=10",
    "playwright==1.62.0",
    "allure-python-commons>=2.13",
    "typer>=0.12",
]

[project.scripts]
peeksy = "peeksy.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peeksy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
